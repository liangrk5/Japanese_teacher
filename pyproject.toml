[project]
name = "nihongo-tutor"
version = "0.1.0"
description = "零基础日语学习助手：假名、单词间隔复习、AI 老师、语法与发音练习"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pywebview>=6.2; sys_platform == 'darwin'",
]

[project.scripts]
nihongo = "nihongo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nihongo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
